<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>password generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>
        Random password <br />
        <span>generator</span>
      </h1>
      <input type="range" min="5" max="16" value="5" id="slider" />
      <p id="slider-length">Password Length:<span class="slider-num">5</span></p>
      <div class="input-box">
        <input type="text" id="inp" placeholder="password" />

        <i class="ri-file-copy-line" id="copyIcon"></i>
      </div>
      <div id="copy-msg">Copied !</div>
      <button id="passwordBtn">
        <i class="ri-flashlight-line btnIcon"></i> Hit me to generate password
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
